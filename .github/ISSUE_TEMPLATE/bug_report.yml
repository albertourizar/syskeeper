name: Informe de error
description: Notifica un fallo reproducible de syskeeper
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de informar. No incluyas rutas personales,
        seriales de disco ni tokens en la descripción.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
      description: ¿Qué esperabas que ocurriera y qué ocurrió realmente?
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ejecuto `syskeeper limpiar --solo temporales`
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: comando
    attributes:
      label: Comando exacto
      placeholder: syskeeper limpiar --aplicar --solo temporales --sin-color
    validations:
      required: true

  - type: dropdown
    id: modo
    attributes:
      label: Modo de ejecución
      options:
        - Simulación (sin --aplicar)
        - Aplicado (--aplicar)
        - smart / informe
        - Otro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de syskeeper
      description: Salida de `syskeeper --version`.
      placeholder: syskeeper 1.0.0
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Versión de Windows y de Python.
      placeholder: Windows 11 24H2 · Python 3.14.5
    validations:
      required: true

  - type: textarea
    id: salida
    attributes:
      label: Salida o informe
      description: Pega el fragmento relevante de la consola, el JSON o el log.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones previas
      options:
        - label: He buscado un issue duplicado.
          required: true
        - label: He probado con la última versión de main.
          required: false
        - label: He eliminado datos personales de la salida.
          required: true
